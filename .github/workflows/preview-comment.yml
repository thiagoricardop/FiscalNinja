name: Preview URL Comment

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '🚀 Vercel Preview'

      - name: Post or update preview comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### 🚀 Vercel Preview

            A preview deployment for this PR is being generated by Vercel.

            **Preview URL:** Check the "Vercel" status check below or visit your [Vercel dashboard](https://vercel.com) for the preview link.

            ---
            _Last updated: ${{ github.event.pull_request.head.sha }}_
